[project]
name = "msmbg-fit"
version = "0.1.0"
description = "Multi Bi-Gaussian fitting tool for native mass spectrometry data analysis and deconvolution."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dearpygui>=2.1.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pybaselines>=1.2.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.0",
    "whittaker-eilers>=0.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = []